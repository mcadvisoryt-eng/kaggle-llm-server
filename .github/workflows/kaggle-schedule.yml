# ============================================================================
# Kaggle LLM — schedule + manual control
# Place at: .github/workflows/kaggle-schedule.yml
# ============================================================================
# SCHEDULE (IST; GitHub cron is UTC, IST = UTC+5:30):
#   06:00 IST  start            -> 30 0 * * *
#   07:00 IST  health (ensure)  -> 30 1 * * *
#   15:00 IST  health (ensure)  -> 30 9 * * *
#   22:30 IST  stop             -> 0 17 * * *
#
# The control page's Start/Stop call this workflow via the GitHub API:
#   Start -> enable() then POST /dispatches  with {action: "start", delay_min}
#   Stop  -> PUT /disable
#
# REQUIRED REPO SECRETS:
#   KAGGLE_JSON        the whole kaggle.json (preferred, one paste)
#     -- or -- KAGGLE_USERNAME + KAGGLE_KEY
#   KAGGLE_NOTEBOOK    slug, e.g. youruser/your-notebook-title
# OPTIONAL: NTFY_TOPIC, TG_BOT_TOKEN, TG_CHAT_ID
# ============================================================================
name: Kaggle LLM Schedule

on:
  schedule:
    - cron: "30 0 * * *"   # 06:00 IST start
    - cron: "30 1 * * *"   # 07:00 IST health
    - cron: "30 9 * * *"   # 15:00 IST health
    - cron: "0 17 * * *"   # 22:30 IST stop
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        required: false
        default: "auto"
        type: choice
        options: [auto, start, ensure, stop]
      delay_min:
        description: "Random delay before starting (minutes, set by the control page)"
        required: false
        default: "0"
        type: string

permissions:
  contents: read

concurrency:
  group: kaggle-llm
  cancel-in-progress: false

jobs:
  manage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI (pinned for legacy auth)
        run: pip install kaggle==1.6.17

      - name: Decide action
        id: decide
        run: |
          FORCED="${{ github.event.inputs.action }}"
          if [ -n "$FORCED" ] && [ "$FORCED" != "auto" ]; then
            echo "action=$FORCED" >> "$GITHUB_OUTPUT"
            echo "Forced: $FORCED"
            exit 0
          fi
          UH=$(date -u +%H); UM=$(date -u +%M)
          if [ "$UH" = "00" ] && [ "$UM" -ge 25 ]; then echo "action=start" >> "$GITHUB_OUTPUT"
          elif [ "$UH" = "17" ] && [ "$UM" -ge 25 ]; then echo "action=stop" >> "$GITHUB_OUTPUT"
          else echo "action=ensure" >> "$GITHUB_OUTPUT"; fi

      - name: Run manager
        env:
          KAGGLE_JSON: ${{ secrets.KAGGLE_JSON }}          # whole kaggle.json (preferred)
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}  # or the two separate values
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_NOTEBOOK: ${{ secrets.KAGGLE_NOTEBOOK }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DELAY_MIN: ${{ github.event.inputs.delay_min }}
          KAGGLE_FORCE: ${{ github.event.inputs.action == 'start' && '1' || '0' }}
        run: |
          echo "Action: ${{ steps.decide.outputs.action }}  delay: ${DELAY_MIN:-0}m"
          python kaggle_manager.py ${{ steps.decide.outputs.action }}
