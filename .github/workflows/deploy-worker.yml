# ============================================================================
# Deploy the Cloudflare Worker (kaggle-llm-control) + push its secrets
# Place at: .github/workflows/deploy-worker.yml
# ============================================================================
# Deploys worker.js to Cloudflare with Wrangler whenever it changes on main,
# or on demand. Config (name, vars, KV binding) comes from wrangler.toml.
# It then pushes the Worker's secrets from encrypted repo secrets, so no
# credential is ever committed to this (public) repository.
#
# REPO SECRETS (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   <- YOU add this (Edit Cloudflare Workers template)
#   CLOUDFLARE_ACCOUNT_ID  <- already set
#   PANEL_PASS             <- set (test value; change later)
#   API_KEY                <- set (test value; change later)
#   WORKER_SECRET          <- set (test value; change later)
#   WORKER_GH_TOKEN        <- YOU add this: fine-grained PAT,
#                             Actions: Read+write, Contents: Read on this repo
# ============================================================================
name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "worker.js"
      - "wrangler.toml"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Push Worker secrets (from encrypted repo secrets)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SEC_PANEL_PASS: ${{ secrets.PANEL_PASS }}
          SEC_API_KEY: ${{ secrets.API_KEY }}
          SEC_WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
          SEC_GH_TOKEN: ${{ secrets.WORKER_GH_TOKEN }}
          SEC_GOOGLE: ${{ secrets.GOOGLE_API_KEY }}
          SEC_GROQ: ${{ secrets.GROQ_API_KEY }}
          SEC_SAMBANOVA: ${{ secrets.SAMBANOVA_API_KEY }}
          SEC_OPENROUTER: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          put() {
            if [ -n "$2" ]; then
              printf '%s' "$2" | npx --yes wrangler@3 secret put "$1" --name kaggle-llm-control
            else
              echo "skip $1 (repo secret not set)"
            fi
          }
          put PANEL_PASS    "$SEC_PANEL_PASS"
          put API_KEY       "$SEC_API_KEY"
          put WORKER_SECRET "$SEC_WORKER_SECRET"
          put GITHUB_TOKEN  "$SEC_GH_TOKEN"
          # Free model providers (each is skipped if the repo secret isn't set).
          # The Worker tries them in this order: Google, Groq, SambaNova, OpenRouter.
          put GOOGLE_API_KEY     "$SEC_GOOGLE"
          put GROQ_API_KEY       "$SEC_GROQ"
          put SAMBANOVA_API_KEY  "$SEC_SAMBANOVA"
          put OPENROUTER_API_KEY "$SEC_OPENROUTER"
